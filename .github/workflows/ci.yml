name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pats
          POSTGRES_PASSWORD: pats
          POSTGRES_DB: pats
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pats"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PATS_TEST_DSN: postgres://pats:pats@localhost:5432/pats?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            integration/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && (cd integration && go vet ./...)
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
          working-directory: .
      - name: staticcheck (integration)
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
          working-directory: integration

      - name: unit tests
        run: go test -race ./...
      - name: integration tests
        working-directory: integration
        run: go test -race ./...
